name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners ship with the Android SDK preinstalled.
      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > sdk.log 2>&1 \
            || { tail -20 sdk.log | sed 's/^/::error title=sdkmanager::/'; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log; then
            # Surface the real errors as annotations (readable without downloading logs).
            grep -E '^e: |error:|AAPT|What went wrong|Could not|> ' build.log \
              | grep -v '^> Task' | head -60 > errors.txt || true
            # GitHub keeps only 10 annotations per step, so pack the lines into one.
            echo "::error title=build::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' errors.txt)"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crew-data-saver-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
